# Managed by baton. Re-running `baton init` overwrites this file.
# Regenerates state.md and publishes it to the state branch (baton/state by
# default). It never commits to the default branch.
name: baton state

on:
  push:
    branches-ignore: ["baton/**"]
  pull_request:
    types: [opened, reopened, closed, edited, ready_for_review, converted_to_draft]
  issues:
    types: [opened, reopened, closed, edited, labeled, unlabeled]
  # Claim branches (baton/claim/<issue>) being created or deleted.
  create:
  delete:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: baton-state
  cancel-in-progress: true

jobs:
  state:
    if: >-
      (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      ((github.event_name != 'create' && github.event_name != 'delete') || startsWith(github.event.ref, 'baton/claim/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          __NODE__
      - name: Publish state
        run: node .baton/lib/bin/baton.mjs state --publish --setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
