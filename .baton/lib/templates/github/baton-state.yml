# Managed by baton. Re-running `baton init` overwrites this file.
# Regenerates state.md and publishes it to the state branch (baton/state by
# default). It never commits to the default branch.
name: baton state

on:
  # The default branch, plus claim branches (baton/claim/<issue>).
  push:
    branches: [__BRANCHES__, "baton/claim/**"]
  pull_request:
    types: [opened, reopened, closed, edited, ready_for_review, converted_to_draft]
  issues:
    types: [opened, reopened, closed, edited, labeled, unlabeled]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  state:
    # At the job level, so runs that end up skipped never cancel a real one.
    # A newer run waits for the current one rather than cancelling it.
    concurrency:
      group: baton-state
      cancel-in-progress: false
    if: >-
      (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'baton/claim/')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          __NODE__
      - name: Publish state
        run: node .baton/lib/bin/baton.mjs state --publish --setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
